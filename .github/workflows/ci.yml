name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Generate the test library
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          pip install mutagen
          python3 tools/testlib/generate.py
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      # The gate test replays recorded MusicBrainz responses from tests/fixtures, so CI never calls MusicBrainz.
      - run: dotnet test --no-build --configuration Release
      - name: Check the model matches the migrations
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes -p src/Navidex.Core --no-build --configuration Release

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      # The tests run in Development, which serves the web app differently; this checks the published image.
      - name: Smoke-test the image
        run: |
          mkdir -p music
          docker compose up -d
          for i in $(seq 30); do curl -fs http://localhost:8787/api/v1/health && break; sleep 2; done
          page=$(curl -fs http://localhost:8787/)
          assets=$(echo "$page" | grep -oE '(src|href)="[^"#]+\.(js|css)"' | cut -d'"' -f2)
          test -n "$assets"
          for asset in $assets; do curl -fs -o /dev/null "http://localhost:8787/$asset" || { echo "missing: $asset"; exit 1; }; done
          if echo "$page" | grep -q '#\['; then echo "unfilled asset placeholder in index.html"; exit 1; fi
      - if: failure()
        run: docker compose logs
