name: Release

# Pushing a tag such as v1.0.0 publishes that release: every image to the GitHub Container Registry, for amd64 and
# arm64, tagged 1.0.0, 1.0 and latest; then a GitHub release with the changelog's notes for it.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: The tag, Directory.Build.props and the changelog agree
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          props=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)
          if [ "$props" != "$version" ]; then echo "Directory.Build.props says $props, the tag says $version"; exit 1; fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then echo "CHANGELOG.md has no section for [$version]"; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  images:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: melodex
            context: .
            file: docker/core.Dockerfile
          - image: melodex-beets-worker
            context: beets-worker
            file: beets-worker/Dockerfile
          - image: melodex-retriever-ytdlp
            context: plugins/retriever-ytdlp
            file: plugins/retriever-ytdlp/Dockerfile
          - image: melodex-retriever-inbox
            context: plugins/retriever-inbox
            file: plugins/retriever-inbox/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          # latest only for releases, not pre-releases such as 1.1.0-beta.1.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.check.outputs.version }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  release:
    needs: [check, images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the release with the changelog's notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          flags=""
          case "$VERSION" in *-*) flags="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" --title "Melodex $VERSION" --notes-file notes.md --verify-tag $flags
